<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ajouter un produit</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f4f8; padding: 20px; }
        h1 { color: #1e90ff; }
        form { background-color: white; padding: 20px; border-radius: 10px; max-width: 400px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input[type=text], input[type=number], input[type=float] { width: 100%; padding: 8px; margin-top: 5px; border-radius: 5px; border: 1px solid #ccc; }
        button { margin-top: 15px; background-color: #1e90ff; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; }
        button:hover { background-color: #63b3ed; }
        a { text-decoration: none; color: white; background-color: #1e90ff; padding: 8px 16px; border-radius: 5px; display: inline-block; margin-bottom: 15px; }
        a:hover { background-color: #63b3ed; }
    </style>
</head>
<body>
    <h1>Ajouter un produit</h1>

    <a href="/dashboard">⬅ Retour au dashboard</a>

    <form action="/add-product" method="post">
        <label for="name">Nom du produit :</label>
        <input type="text" id="name" name="name" required>

        <label for="quantity">Quantité :</label>
        <input type="number" id="quantity" name="quantity" required min="1">

        <label for="price">Prix (FCFA) :</label>
        <input type="number" id="price" name="price" required min="0" step="0.01">

        <button type="submit">Ajouter le produit</button>
    </form>

    <h2>Ajouter un produit</h2>
<form action="/add-product" method="post">
    <label>Nom du produit:</label>
    <input type="text" name="name" required><br><br>

    <label>Quantité:</label>
    <input type="number" name="quantity" min="1" required><br><br>

    <label>Prix (FCFA):</label>
    <input type="number" name="price" step="0.01" min="0" required><br><br>

    <button type="submit">Ajouter</button>
</form>


</body>
</html>
