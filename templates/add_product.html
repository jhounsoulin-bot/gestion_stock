<!DOCTYPE html>
<html>
<head>
    <title>Ajouter un produit</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
        header { background: #4CAF50; color: white; padding: 15px; text-align: center; }
        h1 { margin: 0; }
        main { padding: 20px; }
        form { background: #fff; padding: 20px; border-radius: 8px; width: 400px; margin: auto; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input[type=text], input[type=number] { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }
        button { margin-top: 15px; padding: 10px 15px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #45a049; }
        a.button { display: inline-block; margin-top: 10px; text-decoration: none; color: #2196F3; }
        a.button:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <header>
        <h1>Ajouter un produit</h1>
    </header>
    <main>
        <form action="/add-product" method="post">
            <label for="name">Nom du produit :</label>
            <input type="text" name="name" id="name" required>

            <label for="quantity">Quantité :</label>
            <input type="number" name="quantity" id="quantity" min="1" required>

            <label for="price">Prix unitaire (FCFA) :</label>
            <input type="number" step="0.01" name="price" id="price" min="0" required>

            <button type="submit">Ajouter le produit</button>
        </form>

        <a href="/dashboard" class="button">Retour au dashboard</a>
    </main>
</body>
</html>
