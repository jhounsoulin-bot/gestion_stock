<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Enregistrer une vente</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f4f8; margin: 0; padding: 20px; }
        h1 { color: #1e90ff; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #87CEEB; color: white; }
        input[type=number] { width: 60px; }
        tfoot td { font-weight: bold; }
        button { background-color: #1e90ff; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; }
        button:hover { background-color: #63b3ed; }
        .top-actions { display: flex; gap: 10px; align-items: center; margin-top: 20px; }
        .top-actions a { text-decoration: none; color: white; background-color: #1e90ff; padding: 8px 16px; border-radius: 5px; }
        .top-actions a:hover { background-color: #63b3ed; }
        #grand-total { font-size: 18px; }
    </style>
</head>
<body>
    <h1>Enregistrer une vente</h1>

    <div class="top-actions">
        <a href="/dashboard">⬅ Retour au dashboard</a>
    </div>

    <form action="/sale" method="post" id="saleForm">
        <label for="client_name">Nom du client :</label>
        <input type="text" name="client_name" id="client_name" required placeholder="Nom du client">

        <table>
            <thead>
                <tr>
                    <th>Produit</th>
                    <th>Prix unitaire (FCFA)</th>
                    <th>Stock disponible</th>
                    <th>Quantité vendue</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody>
                {% for product in products %}
                <tr>
                    <td>{{ product.name }}</td>
                    <td>{{ product.price }}</td>
                    <td>{{ product.quantity }}</td>
                    <td>
                        <input type="hidden" name="product_ids[]" value="{{ product.id }}">
                        <input type="number" name="quantities[]" value="0" min="0" max="{{ product.quantity }}" class="qty">
                    </td>
                    <td class="line-total">0 FCFA</td>
                </tr>
                {% endfor %}
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="4">TOTAL GÉNÉRAL</td>
                    <td id="grand-total">0 FCFA</td>
                </tr>
            </tfoot>
        </table>

        <br>
        <button type="submit">Valider la vente</button>
    </form>

    <script>
        const form = document.getElementById('saleForm');
        const rows = document.querySelectorAll('tbody tr');

        function updateTotals() {
            let grandTotal = 0;
            rows.forEach(row => {
                const price = parseFloat(row.cells[1].textContent);
                const stock = parseInt(row.cells[2].textContent);
                const qtyInput = row.querySelector('.qty');
                let qty = parseInt(qtyInput.value) || 0;
                if (qty > stock) qty = stock;
                qtyInput.value = qty;
                const lineTotal = price * qty;
                row.querySelector('.line-total').textContent = lineTotal.toFixed(2) + " FCFA";
                grandTotal += lineTotal;
            });
            document.getElementById('grand-total').textContent = grandTotal.toFixed(2) + " FCFA";
        }

        rows.forEach(row => row.querySelector('.qty').addEventListener('input', updateTotals));

        form.addEventListener('submit', function(e) {
            if (!rows.some(row => parseInt(row.querySelector('.qty').value) > 0)) {
                e.preventDefault();
                alert("Veuillez entrer au moins une quantité supérieure à 0 !");
            }
        });

        updateTotals();
    </script>
</body>
</html>
