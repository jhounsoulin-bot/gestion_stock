{% extends "base.html" %}
{% block title %}Réapprovisionnement{% endblock %}

{% block content %}
<h2>Réapprovisionnement du produit : {{ product.name }}</h2>

<form action="/reapprovisionnement/{{ product.id }}" method="post">
  <label>Quantité à ajouter :</label>
  <input type="number" step="0.5" name="added_quantity" required><br><br>

  <label>Nouveau prix :</label>
  <input type="number" step="0.01" name="new_price" value="{{ product.price }}" required><br><br>

  <button type="submit">Mettre à jour</button>
</form>
{% endblock %}
