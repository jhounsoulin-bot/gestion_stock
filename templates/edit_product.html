<!-- edit_product.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Modifier Produit</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #87CEEB;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            margin: 0;
            font-size: 24px;
        }
        header a.logout {
            background-color: white;
            color: #87CEEB;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        header a.logout:hover {
            background-color: #b0e0e6;
        }
        .container {
            padding: 20px 30px;
        }
        .card {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: auto;
        }
        .card h2 {
            margin-top: 0;
            color: #333;
        }
        .form-inline input, .form-inline button {
            padding: 10px;
            margin-bottom: 15px;
            width: 100%;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        .form-inline button {
            background-color: #87CEEB;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .form-inline button:hover {
            background-color: #00bfff;
        }
        .back-link {
            display: block;
            margin-top: 10px;
            text-align: center;
            text-decoration: none;
            color: #87CEEB;
            font-weight: bold;
        }
        .back-link:hover {
            color: #00bfff;
        }
    </style>
</head>
<body>
<header>
    <h1>Modifier Produit</h1>
    <a href="/logout" class="logout">Déconnexion</a>
</header>

<div class="container">
    <div class="card">
        <h2>{{ product.name }}</h2>
        <form class="form-inline" action="/edit-product/{{ product.id }}" method="post">
            <input type="text" name="name" placeholder="Nom produit" value="{{ product.name }}" required>
            <input type="number" name="quantity" placeholder="Quantité" value="{{ product.quantity }}" min="0" required>
            <input type="number" name="price" placeholder="Prix" value="{{ product.price }}" step="0.01" min="0" required>
            <button type="submit">Enregistrer les modifications</button>
        </form>
        <form action="/delete-product/{{ product.id }}" method="post" onsubmit="return confirm('Voulez-vous vraiment supprimer ce produit ?');">
            <button type="submit" style="background-color: #ff4d4d;">Supprimer le produit</button>
        </form>
        <a href="/dashboard" class="back-link">← Retour au Dashboard</a>
    </div>
</div>
</body>
</html>
